<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="game-page">
    <div class="container">
        <div class="board-wrapper">
            <div class="chess-board" id="chessBoard">
                <!-- Chess board squares will be generated by JavaScript -->
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-header">Player</div>
                <div class="player-info">
                    <div class="player-icon">♔</div>
                    <div class="player-details">
                        <h3 id="playerName">Player 1</h3>
                        <p id="playerRole">Waiting to join...</p>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Game Info</div>
                <div class="info-row">
                    <span class="info-label">Playing as</span>
                    <span class="info-value" id="playingAs">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Current Move</span>
                    <span class="info-value" id="currentMove">White</span>
                </div>
            </div>

            <div class="panel">
                <button id="giveUpBtn" class="give-up-btn">Give Up</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="gameOverTitle">Game Over</h2>
            </div>
            <div class="modal-body">
                <p id="gameOverMessage">Player wins!</p>
            </div>
            <div class="modal-footer">
                <button id="backToHomeBtn" class="modal-btn">Back to Home</button>
            </div>
        </div>
    </div>

    <script src="/js/game.js"></script>
</body>
</html>
