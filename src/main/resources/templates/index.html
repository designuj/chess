<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess - Game Lobby</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .page-header {
            max-width: 1200px;
            margin: 0 auto 32px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .page-header p {
            color: #666;
            font-size: 14px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
        }

        @media (min-width: 900px) {
            .main-container {
                grid-template-columns: 380px 1fr;
            }
        }

        /* Player Setup Section */
        .player-section {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .input-field {
            margin-bottom: 16px;
        }

        .input-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #555;
        }

        .input-field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            transition: all 0.2s ease;
        }

        .input-field input:focus {
            outline: none;
            border-color: #666;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-primary {
            background: #333;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a1a1a;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #666;
            color: white;
        }

        .btn-secondary:hover {
            background: #555;
        }

        /* Games Section */
        .games-section {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }

        .games-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .games-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .refresh-btn {
            background: #333;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .refresh-btn:hover {
            background: #1a1a1a;
        }

        .games-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-item {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .game-item:hover {
            border-color: #999;
            background: #f5f5f5;
        }

        .game-details h3 {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .game-details p {
            font-size: 12px;
            color: #666;
        }

        .game-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            background: #333;
            color: white;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 48px 20px;
            font-size: 13px;
            line-height: 1.8;
        }

        .info-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .info-box p {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            margin: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .modal-message {
            color: #555;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
        }

        .btn-text {
            background: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-text:hover {
            background: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>Chess Game</h1>
        <p>Play chess online with friends</p>
    </div>

    <div class="main-container">
        <!-- Player Setup Section -->
        <div class="player-section">
            <h2 class="section-title">Player Setup</h2>

            <div class="input-field">
                <label for="playerName">Your Name</label>
                <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="createGameBtn" onclick="createNewGame()" disabled>
                    Create New Game
                </button>
                <button class="btn btn-secondary" id="continueBtn" onclick="continueMyGame()" style="display: none;">
                    Continue My Game
                </button>
            </div>
        </div>

        <!-- Games Section -->
        <div class="games-section" id="gamesSection">
            <div class="games-header">
                <h2>Available Games</h2>
                <button class="refresh-btn" onclick="loadGames()" title="Refresh">↻</button>
            </div>

            <div id="gamesContent">
                <div class="empty-message">
                    Enter your name to see available games
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="errorModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Information</div>
            <p class="modal-message" id="modalMessage">Message content</p>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_EXPIRY_DAYS = 30;

        function generatePlayerId() {
            return 'player_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        }

        function setWithExpiry(key, value) {
            const now = new Date();
            const item = {
                value: value,
                expiry: now.getTime() + (STORAGE_EXPIRY_DAYS * 24 * 60 * 60 * 1000)
            };
            localStorage.setItem(key, JSON.stringify(item));
        }

        function getWithExpiry(key) {
            const itemStr = localStorage.getItem(key);
            if (!itemStr) return null;

            try {
                const item = JSON.parse(itemStr);
                const now = new Date();

                if (now.getTime() > item.expiry) {
                    localStorage.removeItem(key);
                    return null;
                }
                return item.value;
            } catch (e) {
                return itemStr;
            }
        }

        function getCurrentPlayer() {
            return {
                playerId: getWithExpiry('playerId'),
                playerName: getWithExpiry('playerName')
            };
        }

        function showModal(title, message) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('errorModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('errorModal').classList.remove('show');
        }

        function initializePlayer() {
            const nameInput = document.getElementById('playerName');
            const createGameBtn = document.getElementById('createGameBtn');

            // Load existing player name
            const savedName = getWithExpiry('playerName');
            if (savedName) {
                nameInput.value = savedName;
                createGameBtn.disabled = false;
                loadGames();
            }

            // Update on input
            nameInput.addEventListener('input', function() {
                const name = this.value.trim();

                if (name) {
                    let playerId = getWithExpiry('playerId');
                    if (!playerId) {
                        playerId = generatePlayerId();
                        setWithExpiry('playerId', playerId);
                    }
                    setWithExpiry('playerName', name);
                    createGameBtn.disabled = false;
                    loadGames();
                } else {
                    localStorage.removeItem('playerName');
                    createGameBtn.disabled = true;
                    document.getElementById('continueBtn').style.display = 'none';
                    document.getElementById('gamesContent').innerHTML = `
                        <div class="empty-message">
                            Enter your name to see available games
                        </div>
                    `;
                }
            });
        }

        async function createNewGame() {
            const player = getCurrentPlayer();

            if (!player.playerName) {
                showModal('Missing Information', 'Please enter your name to create a game.');
                return;
            }

            if (!player.playerId) {
                player.playerId = generatePlayerId();
                setWithExpiry('playerId', player.playerId);
            }

            try {
                // Check if player already has an active game
                const existingResponse = await fetch(`/api/games/my-game?playerId=${encodeURIComponent(player.playerId)}`);
                if (existingResponse.ok) {
                    const existingGame = await existingResponse.json();
                    showModal('Existing Game Found', `You already have an active game. Redirecting...`);
                    setTimeout(() => {
                        window.location.href = `/game/${existingGame.id}`;
                    }, 1500);
                    return;
                }

                // Create new game
                const response = await fetch('/api/games', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerId: player.playerId, playerName: player.playerName })
                });

                if (response.ok) {
                    const game = await response.json();
                    showModal('Game Created', `Game created successfully! Redirecting...`);
                    setTimeout(() => {
                        window.location.href = `/game/${game.id}`;
                    }, 1000);
                } else {
                    const error = await response.json();
                    showModal('Cannot Create Game', error.error || 'Failed to create game');
                }
            } catch (error) {
                console.error('Error:', error);
                showModal('Connection Error', 'Failed to connect to the server. Please try again.');
            }
        }

        async function joinGame(gameId) {
            const player = getCurrentPlayer();

            if (!player.playerName) {
                showModal('Missing Information', 'Please enter your name to join a game.');
                return;
            }

            if (!player.playerId) {
                player.playerId = generatePlayerId();
                setWithExpiry('playerId', player.playerId);
            }

            try {
                const response = await fetch(`/api/games/${gameId}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerId: player.playerId, playerName: player.playerName })
                });

                if (response.ok) {
                    showModal('Joined Game', 'Successfully joined the game! Redirecting...');
                    setTimeout(() => {
                        window.location.href = `/game/${gameId}`;
                    }, 1000);
                } else {
                    const error = await response.json();
                    const errorMessage = error.error || 'Failed to join game';

                    if (errorMessage.includes('already have an active game')) {
                        const gameIdMatch = errorMessage.match(/game: (\w+)/);
                        if (gameIdMatch) {
                            const existingGameId = gameIdMatch[1];
                            showModal('Active Game Found', `You already have an active game. Redirecting...`);
                            setTimeout(() => {
                                window.location.href = `/game/${existingGameId}`;
                            }, 2000);
                        } else {
                            showModal('Active Game Exists', 'You already have an active game. Please finish it first.');
                        }
                    } else {
                        showModal('Cannot Join Game', errorMessage);
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showModal('Connection Error', 'Failed to connect to the server. Please try again.');
            }
        }

        async function loadGames() {
            const player = getCurrentPlayer();

            if (!player.playerName || !player.playerId) {
                return;
            }

            const gamesContent = document.getElementById('gamesContent');
            const continueBtn = document.getElementById('continueBtn');

            try {
                // Check if player has an active game
                const myGameResponse = await fetch(`/api/games/my-game?playerId=${encodeURIComponent(player.playerId)}`);

                if (myGameResponse.ok) {
                    // Player has active game
                    const myGame = await myGameResponse.json();
                    continueBtn.style.display = 'block';
                    continueBtn.setAttribute('data-game-id', myGame.id);
                    continueBtn.textContent = `Continue Game ${myGame.id}`;

                    gamesContent.innerHTML = `
                        <div class="info-box">
                            <p>You have an active game in progress.<br>Use the "Continue" button to resume playing.</p>
                        </div>
                    `;
                } else {
                    // No active game - show available games
                    continueBtn.style.display = 'none';

                    const response = await fetch(`/api/games?playerId=${encodeURIComponent(player.playerId)}`);
                    const allGames = await response.json();

                    if (allGames.length === 0) {
                        gamesContent.innerHTML = `
                            <div class="empty-message">
                                No games available to join<br>
                                <small>Create a new game to start playing</small>
                            </div>
                        `;
                        return;
                    }

                    const gamesList = allGames.map(game => `
                        <div class="game-item" onclick="joinGame('${game.id}')">
                            <div class="game-details">
                                <h3>Game ${game.id}</h3>
                                <p>${game.whitePlayerName || 'Player'} is waiting for opponent</p>
                            </div>
                            <div class="game-badge">Join</div>
                        </div>
                    `).join('');

                    gamesContent.innerHTML = `<div class="games-list">${gamesList}</div>`;
                }
            } catch (error) {
                console.error('Error loading games:', error);
                gamesContent.innerHTML = `
                    <div class="empty-message">
                        Failed to load games<br>
                        <small>Please check your connection and try again</small>
                    </div>
                `;
            }
        }

        function continueMyGame() {
            const continueBtn = document.getElementById('continueBtn');
            const gameId = continueBtn.getAttribute('data-game-id');
            if (gameId) {
                window.location.href = `/game/${gameId}`;
            }
        }

        // Initialize on page load
        initializePlayer();

        // Auto-refresh every 5 seconds if player name is set
        setInterval(() => {
            const player = getCurrentPlayer();
            if (player.playerName) {
                loadGames();
            }
        }, 5000);
    </script>
</body>
</html>
